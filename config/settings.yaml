paths:
  knowledge_store: "${CASE_BASE_DIR}/Family/Health/Longevity/Health-Panel"
  skill_output: "${CASE_BASE_DIR}/Family/Health/Longevity/Health-Panel/.claude/skills/health-panel"

extraction:
  # Subscription CLI path (ADR 0003). Extraction + build map run on Haiku (cheap,
  # fast, conserves the Max 20x window); the final reduce uses Sonnet for quality.
  model: "cli/claude:claude-haiku-4-5-20251001"
  build_model: "cli/claude:claude-sonnet-4-6"
  build_map_model: "cli/claude:claude-haiku-4-5-20251001"
  chunk_size_tokens: 3000
  chunk_overlap_tokens: 200
  max_output_tokens: 8192
  min_split_words: 120
  max_retries: 3
  dead_letter_after: 3

transcription:
  provider: "groq"
  model: "whisper-large-v3"
  use_for_youtube: false
  use_for_podcast_audio: true

build:
  map_reduce_threshold: 50
  map_chunk_size: 100
  min_experts_to_publish: 2
  min_claims_to_publish: 3

providers:
  claude: { enabled: true }
  gemini: { enabled: false }
  codex:  { enabled: false }
  grok:   { enabled: false }

api:
  cli_timeout_s: 180
  extract_limit: null
